<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>RNG RPG Base</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: black;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#ui {
    position: absolute;
    width: 1024px;
    height: 1024px;
    pointer-events: none;
}

.btn {
    position: absolute;
    width: 220px;
    height: 80px;
    pointer-events: auto;
    user-select: none;
}

#bossBtn {
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
}

#rollBtn {
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
}

#stateText {
    position: absolute;
    bottom: 20px;
    left: 20px;
    color: white;
    font-size: 16px;
    font-family: monospace;
    line-height: 1.4;
    white-space: pre;
}

canvas {
    background: black;
    display: block;
}
</style>
</head>

<body>

<div id="ui">
    <img id="bossBtn" class="btn" src="image/bossbutton.png">
    <img id="rollBtn" class="btn" src="image/rollbutton.png">

    <div id="stateText"></div>
</div>

<canvas id="game" width="1024" height="1024"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const bg = new Image();
bg.src = "image/s1.png";

const playerImg = new Image();
playerImg.src = "image/player.png";

const player = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    size: 100
};

// 🧠 게임 상태
const state = {
    gold: 100,
    heart: 100,
    stage: 1,
    pet1: "a",
    pet2: "b",
    pet3: "c"
};

function updateStateUI() {
    document.getElementById("stateText").innerText =
`gold:${state.gold}
stage:${state.stage}
heart:${state.heart}
pet1:${state.pet1}
pet2:${state.pet2}
pet3:${state.pet3}`;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);

    ctx.drawImage(
        playerImg,
        player.x - player.size / 2,
        player.y - player.size / 2,
        player.size,
        player.size
    );

    updateStateUI();

    requestAnimationFrame(draw);
}

bg.onload = () => {
    playerImg.onload = () => {
        draw();
    };
};

// 버튼 테스트
document.getElementById("rollBtn").onclick = () => {
    state.gold += 10;
    state.pet1 = "new";
};

document.getElementById("bossBtn").onclick = () => {
    state.stage += 1;
};
</script>

</body>
</html>
