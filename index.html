<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Pet Fix</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: black;
    overflow: hidden;
    width: 100%;
    height: 100%;
    font-family: monospace;
}

canvas {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: black;
}

#ui {
    position: absolute;
    width: 1024px;
    height: 1024px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

.btn {
    position: absolute;
    width: 140px;
    height: 60px;
    pointer-events: auto;
    display: none;
}

#rollBtn {
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: block;
}

#slot1 { bottom: 100px; left: 20px; }
#slot2 { bottom: 100px; left: 170px; }
#slot3 { bottom: 100px; left: 320px; }
#throwBtn { bottom: 100px; left: 470px; }

#stateText {
    position: absolute;
    bottom: 20px;
    left: 20px;
    color: white;
    white-space: pre;
}

#tempBox {
    position: absolute;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    text-align: center;
}
</style>
</head>

<body>

<canvas id="game" width="1024" height="1024"></canvas>

<div id="ui">

    <div id="tempBox"></div>

    <img id="slot1" class="btn" src="image/1btn.png">
    <img id="slot2" class="btn" src="image/2btn.png">
    <img id="slot3" class="btn" src="image/3btn.png">
    <img id="throwBtn" class="btn" src="image/throwbtn.png">

    <img id="rollBtn" class="btn" src="image/rollbutton.png">

    <div id="stateText"></div>

</div>

<script>
// ---------------- CANVAS ----------------
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const bg = new Image();
bg.src = "image/s1.png";

const player = new Image();
player.src = "image/player.png";

// ---------------- STATE ----------------
const state = {
    coin: 5,
    slots: [null, null, null],
    tempPet: null
};

// ---------------- PET DATA ----------------
const pets = [
    { name:"Bronze PSH", damage:1, speed:500, range:10, sprite:"image/bpsh.png" },
    { name:"Silver PSH", damage:1, speed:250, range:10, sprite:"image/spsh.png" },
    { name:"Gold PSH", damage:2, speed:250, range:10, sprite:"image/gpsh.png" }
];

// ---------------- RENDER WORLD ----------------
function draw() {
    ctx.clearRect(0,0,1024,1024);

    ctx.drawImage(bg,0,0,1024,1024);
    ctx.drawImage(player,462,462,100,100);

    // ✅ TEMP PET IMAGE 표시 (핵심 추가)
    if (state.tempPet) {
        const img = new Image();
        img.src = state.tempPet.sprite;
        ctx.drawImage(img, 462, 350, 100, 100);
    }

    requestAnimationFrame(draw);
}

// ---------------- UI ----------------
function updateUI() {

    document.getElementById("stateText").innerText =
`coin:${state.coin}
pet1:${state.slots[0]?.name || "null"}
pet2:${state.slots[1]?.name || "null"}
pet3:${state.slots[2]?.name || "null"}`;

    const tempBox = document.getElementById("tempBox");

    if (state.tempPet) {
        tempBox.innerText = state.tempPet.name;
        showButtons(true);
    } else {
        tempBox.innerText = "";
        showButtons(false);
    }
}

// ---------------- BUTTON SHOW/HIDE FIX ----------------
function showButtons(show) {
    document.getElementById("slot1").style.display = show ? "block" : "none";
    document.getElementById("slot2").style.display = show ? "block" : "none";
    document.getElementById("slot3").style.display = show ? "block" : "none"; // ✔ FIX
    document.getElementById("throwBtn").style.display = show ? "block" : "none";
}

// ---------------- ROLL ----------------
document.getElementById("rollBtn").onclick = () => {
    if (state.coin <= 0) return;

    state.coin--;

    const p = pets[Math.floor(Math.random()*3)];
    state.tempPet = {...p};

    updateUI();
};

// ---------------- SLOT ----------------
slot1.onclick = () => {
    state.slots[0] = state.tempPet;
    state.tempPet = null;
    updateUI();
};

slot2.onclick = () => {
    state.slots[1] = state.tempPet;
    state.tempPet = null;
    updateUI();
};

slot3.onclick = () => {
    state.slots[2] = state.tempPet;
    state.tempPet = null;
    updateUI();
};

throwBtn.onclick = () => {
    state.tempPet = null;
    updateUI();
};

// INIT
draw();
updateUI();

</script>

</body>
</html>
