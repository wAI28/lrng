<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Pet Gacha Fixed</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: black;
    overflow: hidden;
    width: 100%;
    height: 100%;
    touch-action: none;
    font-family: monospace;
}

/* 캔버스 */
canvas {
    background: black;
    display: block;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}

/* UI */
#ui {
    position: absolute;
    width: 1024px;
    height: 1024px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

/* 버튼 */
.btn {
    position: absolute;
    width: 140px;
    height: 60px;
    pointer-events: auto;
    cursor: pointer;
    display: none; /* 기본 숨김 */
}

#rollBtn {
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: block;
}

#slot1 { bottom: 100px; left: 20px; }
#slot2 { bottom: 100px; left: 170px; }
#slot3 { bottom: 100px; left: 320px; }
#throwBtn { bottom: 100px; left: 470px; }

/* 상태 */
#stateText {
    position: absolute;
    bottom: 20px;
    left: 20px;
    color: white;
    white-space: pre;
    font-size: 14px;
}

#tempBox {
    position: absolute;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    text-align: center;
}
</style>
</head>

<body>

<canvas id="game" width="1024" height="1024"></canvas>

<div id="ui">

    <div id="tempBox"></div>

    <img id="slot1" class="btn" src="image/1btn.png">
    <img id="slot2" class="btn" src="image/2btn.png">
    <img id="slot3" class="btn" src="image/3btn.png">
    <img id="throwBtn" class="btn" src="image/throwbtn.png">

    <img id="rollBtn" class="btn" src="image/rollbutton.png">

    <div id="stateText"></div>

</div>

<script>
// --------------------
// CANVAS
// --------------------
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// 배경 + 플레이어
const bg = new Image();
bg.src = "image/s1.png";

const player = new Image();
player.src = "image/player.png";

// --------------------
// STATE
// --------------------
const state = {
    coin: 5,
    slots: [null, null, null],
    tempPet: null
};

// --------------------
// PET DATA
// --------------------
const pets = [
    { id:"bpsh", name:"Bronze PSH", damage:1, speed:500, range:10 },
    { id:"spsh", name:"Silver PSH", damage:1, speed:250, range:10 },
    { id:"gpsh", name:"Gold PSH", damage:2, speed:250, range:10 }
];

// --------------------
// RENDER WORLD
// --------------------
function draw() {
    ctx.clearRect(0,0,1024,1024);

    ctx.drawImage(bg, 0, 0, 1024, 1024);
    ctx.drawImage(player, 462, 462, 100, 100);

    requestAnimationFrame(draw);
}

// --------------------
// UI UPDATE
// --------------------
function updateUI() {

    document.getElementById("stateText").innerText =
`coin:${state.coin}
pet1:${state.slots[0]?.name || "null"}
pet2:${state.slots[1]?.name || "null"}
pet3:${state.slots[2]?.name || "null"}`;

    const tempBox = document.getElementById("tempBox");

    if (state.tempPet) {
        tempBox.innerText = `NEW PET\n${state.tempPet.name}\nDMG:${state.tempPet.damage}`;
        showButtons(true);
    } else {
        tempBox.innerText = "";
        showButtons(false);
    }
}

// --------------------
// BUTTON SHOW/HIDE
// --------------------
function showButtons(show) {
    document.getElementById("slot1").style.display = show ? "block" : "none";
    document.getElementById("slot2").style.display = show ? "block" : "none";
    document.getElementById("slot3").style.display = "block";
    document.getElementById("throwBtn").style.display = show ? "block" : "none";
}

// --------------------
// ROLL
// --------------------
document.getElementById("rollBtn").onclick = () => {

    if (state.coin <= 0) return;

    state.coin--;

    const rand = Math.floor(Math.random()*3);

    state.tempPet = {...pets[rand]};

    updateUI();
};

// --------------------
// SLOT
// --------------------
slot1.onclick = () => {
    state.slots[0] = state.tempPet;
    state.tempPet = null;
    updateUI();
};

slot2.onclick = () => {
    state.slots[1] = state.tempPet;
    state.tempPet = null;
    updateUI();
};

slot3.onclick = () => {
    state.slots[2] = state.tempPet;
    state.tempPet = null;
    updateUI();
};

throwBtn.onclick = () => {
    state.tempPet = null;
    updateUI();
};

// INIT
draw();
updateUI();

</script>

</body>
</html>
