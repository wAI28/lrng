<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Pet Slot System Fixed UI</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: black;
    overflow: hidden;
    width: 100%;
    height: 100%;
    font-family: monospace;
}

canvas {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: black;
}

#ui {
    position: absolute;
    width: 1024px;
    height: 1024px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

.btn {
    position: absolute;
    width: 120px;
    height: 60px;
    pointer-events: auto;
    display: none;
}

#rollBtn {
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: block;
}

#slot1 { bottom: 100px; left: 20px; }
#slot2 { bottom: 100px; left: 160px; }
#slot3 { bottom: 100px; left: 300px; }
#throwBtn { bottom: 100px; left: 440px; }

#stateText {
    position: absolute;
    bottom: 20px;
    left: 20px;
    color: white;
    white-space: pre;
}

</style>
</head>

<body>

<canvas id="game" width="1024" height="1024"></canvas>

<div id="ui">

    <img id="slot1" class="btn" src="image/1btn.png">
    <img id="slot2" class="btn" src="image/2btn.png">
    <img id="slot3" class="btn" src="image/3btn.png">
    <img id="throwBtn" class="btn" src="image/throwbtn.png">

    <img id="rollBtn" class="btn" src="image/rollbutton.png">

    <div id="stateText"></div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// ---------------- WORLD ----------------
const bg = new Image();
bg.src = "image/s1.png";

const playerImg = new Image();
playerImg.src = "image/player.png";

const player = { x: 462, y: 462, size: 100 };

// ---------------- STATE ----------------
const state = {
    coin: 5,
    slots: [null, null, null],
    tempPet: null
};

// ---------------- PET DATA ----------------
const pets = [
    { name:"Bronze PSH", damage:1, speed:500, range:10, sprite:"image/bpsh.png" },
    { name:"Silver PSH", damage:1, speed:250, range:10, sprite:"image/spsh.png" },
    { name:"Gold PSH", damage:2, speed:250, range:10, sprite:"image/gpsh.png" }
];

// ---------------- DRAW LOOP ----------------
function draw() {
    ctx.clearRect(0,0,1024,1024);

    ctx.drawImage(bg,0,0,1024,1024);
    ctx.drawImage(playerImg,player.x,player.y,100,100);

    renderPets();

    requestAnimationFrame(draw);
}

// ---------------- PET RENDER ----------------
function renderPets() {

    const px = player.x;
    const py = player.y;

    const pos = [
        { x: px, y: py - 120 },      // 1번 위
        { x: px + 90, y: py + 90 },  // 2번 5시
        { x: px - 90, y: py + 90 }   // 3번 7시
    ];

    for (let i = 0; i < 3; i++) {
        const pet = state.slots[i];
        if (!pet) continue;

        const img = new Image();
        img.src = pet.sprite;

        ctx.drawImage(img, pos[i].x, pos[i].y, 100, 100);
    }
}

// ---------------- UI ----------------
function updateUI() {

    document.getElementById("stateText").innerText =
`coin: ${state.coin}
slot1: ${state.slots[0]?.name || "null"}
slot2: ${state.slots[1]?.name || "null"}
slot3: ${state.slots[2]?.name || "null"}`;

    if (state.tempPet) {
        setButtons(true);
    } else {
        setButtons(false);
    }
}

// ---------------- BUTTON TOGGLE ----------------
function setButtons(showSelect) {

    document.getElementById("slot1").style.display = showSelect ? "block" : "none";
    document.getElementById("slot2").style.display = showSelect ? "block" : "none";
    document.getElementById("slot3").style.display = showSelect ? "block" : "none";
    document.getElementById("throwBtn").style.display = showSelect ? "block" : "none";

    // 롤 버튼 반전
    document.getElementById("rollBtn").style.display = showSelect ? "none" : "block";
}

// ---------------- ROLL ----------------
document.getElementById("rollBtn").onclick = () => {

    if (state.coin <= 0) return;

    state.coin--;

    const rand = Math.floor(Math.random() * 3);

    state.tempPet = { ...pets[rand] };

    updateUI();
};

// ---------------- SLOT ----------------
document.getElementById("slot1").onclick = () => {
    if (!state.tempPet) return;
    state.slots[0] = state.tempPet;
    state.tempPet = null;
    updateUI();
};

document.getElementById("slot2").onclick = () => {
    if (!state.tempPet) return;
    state.slots[1] = state.tempPet;
    state.tempPet = null;
    updateUI();
};

document.getElementById("slot3").onclick = () => {
    if (!state.tempPet) return;
    state.slots[2] = state.tempPet;
    state.tempPet = null;
    updateUI();
};

document.getElementById("throwBtn").onclick = () => {
    state.tempPet = null;
    updateUI();
};

// INIT
draw();
updateUI();

</script>

</body>
</html>
