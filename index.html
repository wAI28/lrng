<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Pet Gacha Test</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: black;
    overflow: hidden;
    width: 100%;
    height: 100%;
    touch-action: none;
    font-family: monospace;
}

#game {
    width: 100%;
    height: 100%;
    position: relative;
}

/* UI 영역 */
#ui {
    position: absolute;
    width: 1024px;
    height: 1024px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

/* 버튼 */
.btn {
    position: absolute;
    width: 140px;
    height: 60px;
    pointer-events: auto;
    cursor: pointer;
}

#rollBtn {
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
}

#slot1 { bottom: 100px; left: 20px; }
#slot2 { bottom: 100px; left: 170px; }
#slot3 { bottom: 100px; left: 320px; }
#throwBtn { bottom: 100px; left: 470px; }

/* 상태창 */
#stateText {
    position: absolute;
    bottom: 20px;
    left: 20px;
    color: white;
    white-space: pre;
    font-size: 14px;
}

/* temp pet 표시 */
#tempBox {
    position: absolute;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    text-align: center;
}
</style>
</head>

<body>

<div id="game">

    <div id="ui">

        <div id="tempBox"></div>

        <!-- 슬롯 버튼 -->
        <img id="slot1" class="btn" src="image/1btn.png">
        <img id="slot2" class="btn" src="image/2btn.png">
        <img id="slot3" class="btn" src="image/3btn.png">
        <img id="throwBtn" class="btn" src="image/throwbtn.png">

        <!-- roll -->
        <img id="rollBtn" class="btn" src="image/rollbutton.png">

        <!-- 상태 -->
        <div id="stateText"></div>

    </div>

</div>

<script>
// --------------------
// STATE
// --------------------
const state = {
    coin: 5,
    slots: [null, null, null],
    tempPet: null
};

// --------------------
// PET DATA (1:1:1)
// --------------------
const pets = [
    {
        id: "bpsh",
        name: "Bronze PSH",
        damage: 1,
        speed: 500,
        range: 10
    },
    {
        id: "spsh",
        name: "Silver PSH",
        damage: 1,
        speed: 250,
        range: 10
    },
    {
        id: "gpsh",
        name: "Gold PSH",
        damage: 2,
        speed: 250,
        range: 10
    }
];

// --------------------
// UI UPDATE
// --------------------
function updateUI() {
    document.getElementById("stateText").innerText =
`coin:${state.coin}
pet1:${state.slots[0]?.name || "null"}
pet2:${state.slots[1]?.name || "null"}
pet3:${state.slots[2]?.name || "null"}`;

    document.getElementById("tempBox").innerText =
state.tempPet
? `NEW PET\n${state.tempPet.name}\nDMG:${state.tempPet.damage}`
: "NO PET";
}

// --------------------
// ROLL
// --------------------
document.getElementById("rollBtn").onclick = () => {

    if (state.coin <= 0) return;

    state.coin--;

    const rand = Math.floor(Math.random() * 3);
    const p = pets[rand];

    state.tempPet = {
        ...p
    };

    updateUI();
};

// --------------------
// SLOT BUTTONS
// --------------------
document.getElementById("slot1").onclick = () => {
    if (!state.tempPet) return;
    state.slots[0] = state.tempPet;
    state.tempPet = null;
    updateUI();
};

document.getElementById("slot2").onclick = () => {
    if (!state.tempPet) return;
    state.slots[1] = state.tempPet;
    state.tempPet = null;
    updateUI();
};

document.getElementById("slot3").onclick = () => {
    if (!state.tempPet) return;
    state.slots[2] = state.tempPet;
    state.tempPet = null;
    updateUI();
};

// --------------------
// THROW AWAY
// --------------------
document.getElementById("throwBtn").onclick = () => {
    state.tempPet = null;
    updateUI();
};

// init
updateUI();

</script>

</body>
</html>
