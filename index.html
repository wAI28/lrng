<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Pet Battle Game</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    font-family: monospace;
}

canvas {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: black;
}

#ui {
    position: absolute;
    width: 1024px;
    height: 1024px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

.btn {
    position: absolute;
    width: 120px;
    height: 60px;
    pointer-events: auto;
    display: none;
}

#rollBtn {
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: block;
}

#slot1 { bottom: 100px; left: 20px; }
#slot2 { bottom: 100px; left: 160px; }
#slot3 { bottom: 100px; left: 300px; }
#throwBtn { bottom: 100px; left: 440px; }

#stateText {
    position: absolute;
    left: 20px;
    bottom: 20px;
    color: white;
    white-space: pre;
}

#tempBox {
    position: absolute;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
}
</style>
</head>

<body>

<canvas id="game" width="1024" height="1024"></canvas>

<div id="ui">

    <div id="tempBox"></div>

    <img id="slot1" class="btn" src="image/1btn.png">
    <img id="slot2" class="btn" src="image/2btn.png">
    <img id="slot3" class="btn" src="image/3btn.png">
    <img id="throwBtn" class="btn" src="image/throwbtn.png">

    <img id="rollBtn" class="btn" src="image/rollbutton.png">

    <div id="stateText"></div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// ---------------- IMAGES ----------------
const bg = new Image();
bg.src = "image/s1.png";

const playerImg = new Image();
playerImg.src = "image/player.png";

const monsterImg = new Image();
monsterImg.src = "image/s1m.png";

const coinImg = new Image();
coinImg.src = "image/coin.png";

// ---------------- PLAYER ----------------
const player = {
    x: 462,
    y: 462
};

// ---------------- STATE ----------------
const state = {
    coin: 5,
    slots: [null, null, null],
    tempPet: null
};

// ---------------- PET DATA ----------------
const pets = [
    {
        name:"Bronze PSH",
        damage:1,
        speed:500,
        range:120,
        sprite:"image/bpsh.png",
        lastAttack:0,
        effect:0
    },
    {
        name:"Silver PSH",
        damage:1,
        speed:250,
        range:140,
        sprite:"image/spsh.png",
        lastAttack:0,
        effect:0
    },
    {
        name:"Gold PSH",
        damage:2,
        speed:250,
        range:170,
        sprite:"image/gpsh.png",
        lastAttack:0,
        effect:0
    }
];

// ---------------- MONSTERS ----------------
const monsters = [];

// ---------------- COINS ----------------
const coins = [];

// ---------------- MONSTER SPAWN ----------------
setInterval(spawnMonster, 2000);

function spawnMonster() {

    const side = Math.floor(Math.random() * 4);

    let x = 0;
    let y = 0;

    // 위
    if (side === 0) {
        x = Math.random() * 1024;
        y = -120;
    }

    // 아래
    if (side === 1) {
        x = Math.random() * 1024;
        y = 1144;
    }

    // 왼쪽
    if (side === 2) {
        x = -120;
        y = Math.random() * 1024;
    }

    // 오른쪽
    if (side === 3) {
        x = 1144;
        y = Math.random() * 1024;
    }

    monsters.push({
        x: x,
        y: y,
        hp: 10,
        speed: 0.3
    });
}

// ---------------- DRAW ----------------
function draw() {

    ctx.clearRect(0,0,1024,1024);

    ctx.drawImage(bg,0,0,1024,1024);

    renderPlayer();
    renderPets();
    renderMonsters();
    renderCoins();

    updateMonsters();
    updateCoins();
    petAttack();

    requestAnimationFrame(draw);
}

// ---------------- PLAYER ----------------
function renderPlayer() {
    ctx.drawImage(playerImg,player.x,player.y,100,100);
}

// ---------------- PETS ----------------
function renderPets() {

    const pos = [
        { x: player.x, y: player.y - 120 },
        { x: player.x + 90, y: player.y + 90 },
        { x: player.x - 90, y: player.y + 90 }
    ];

    for (let i=0;i<3;i++) {

        const pet = state.slots[i];
        if (!pet) continue;

        const img = new Image();
        img.src = pet.sprite;

        ctx.drawImage(img,pos[i].x,pos[i].y,100,100);

        // 공격 이펙트
        if (Date.now() - pet.effect < 100) {

            ctx.beginPath();

            ctx.arc(
                pos[i].x + 50,
                pos[i].y + 50,
                pet.range,
                0,
                Math.PI * 2
            );

            ctx.fillStyle = "rgba(255,0,0,0.3)";
            ctx.fill();
        }
    }
}

// ---------------- PET ATTACK ----------------
function petAttack() {

    const now = Date.now();

    const pos = [
        { x: player.x, y: player.y - 120 },
        { x: player.x + 90, y: player.y + 90 },
        { x: player.x - 90, y: player.y + 90 }
    ];

    for (let i=0;i<3;i++) {

        const pet = state.slots[i];
        if (!pet) continue;

        if (now - pet.lastAttack < pet.speed) continue;

        pet.lastAttack = now;
        pet.effect = now;

        for (let m of monsters) {

            const dx = (m.x + 50) - (pos[i].x + 50);
            const dy = (m.y + 50) - (pos[i].y + 50);

            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist <= pet.range) {
                m.hp -= pet.damage;
            }
        }
    }

    // 죽은 몬스터 처리
    for (let i=monsters.length-1;i>=0;i--) {

        if (monsters[i].hp <= 0) {

            coins.push({
                x: monsters[i].x,
                y: monsters[i].y
            });

            monsters.splice(i,1);
        }
    }
}

// ---------------- MONSTERS ----------------
function renderMonsters() {

    for (let m of monsters) {

        ctx.drawImage(monsterImg,m.x,m.y,100,100);

        ctx.fillStyle = "white";
        ctx.font = "20px monospace";
        ctx.textAlign = "center";

        ctx.fillText(
            "HP:"+m.hp,
            m.x + 50,
            m.y - 10
        );
    }
}

function updateMonsters() {

    for (let m of monsters) {

        const dx = player.x - m.x;
        const dy = player.y - m.y;

        const dist = Math.sqrt(dx*dx + dy*dy);

        m.x += (dx / dist) * m.speed;
        m.y += (dy / dist) * m.speed;
    }
}

// ---------------- COINS ----------------
function renderCoins() {

    for (let c of coins) {
        ctx.drawImage(coinImg,c.x,c.y,50,50);
    }
}

function updateCoins() {

    for (let i=coins.length-1;i>=0;i--) {

        const c = coins[i];

        const dx = player.x - c.x;
        const dy = player.y - c.y;

        const dist = Math.sqrt(dx*dx + dy*dy);

        c.x += (dx / dist) * 2;
        c.y += (dy / dist) * 2;

        if (dist < 40) {

            state.coin += 1;

            coins.splice(i,1);

            updateUI();
        }
    }
}

// ---------------- UI ----------------
function updateUI() {

    document.getElementById("stateText").innerText =
`coin: ${state.coin}
slot1: ${state.slots[0]?.name || "null"}
slot2: ${state.slots[1]?.name || "null"}
slot3: ${state.slots[2]?.name || "null"}`;

    const tempBox = document.getElementById("tempBox");

    if (state.tempPet) {

        tempBox.innerText =
        "NEW PET: " + state.tempPet.name;

        setButtons(true);

    } else {

        tempBox.innerText = "";

        setButtons(false);
    }
}

// ---------------- BUTTONS ----------------
function setButtons(show) {

    document.getElementById("slot1").style.display =
    show ? "block" : "none";

    document.getElementById("slot2").style.display =
    show ? "block" : "none";

    document.getElementById("slot3").style.display =
    show ? "block" : "none";

    document.getElementById("throwBtn").style.display =
    show ? "block" : "none";

    document.getElementById("rollBtn").style.display =
    show ? "none" : "block";
}

// ---------------- ROLL ----------------
document.getElementById("rollBtn").onclick = () => {

    if (state.coin <= 0) return;

    state.coin--;

    const rand = Math.floor(Math.random() * 3);

    state.tempPet =
    JSON.parse(JSON.stringify(pets[rand]));

    updateUI();
};

// ---------------- SLOT ----------------
document.getElementById("slot1").onclick = () => {

    if (!state.tempPet) return;

    state.slots[0] = state.tempPet;
    state.tempPet = null;

    updateUI();
};

document.getElementById("slot2").onclick = () => {

    if (!state.tempPet) return;

    state.slots[1] = state.tempPet;
    state.tempPet = null;

    updateUI();
};

document.getElementById("slot3").onclick = () => {

    if (!state.tempPet) return;

    state.slots[2] = state.tempPet;
    state.tempPet = null;

    updateUI();
};

document.getElementById("throwBtn").onclick = () => {

    state.tempPet = null;

    updateUI();
};

// INIT
draw();
updateUI();

</script>

</body>
</html>
